[workspace]

[package]
name = "bevy_perf_ui"
version = "0.7.0"
authors = ["Ida 'Iyes', Oleks Pickle <22867443+olekspickle@users.noreply.github.com>"]
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/olekspickle/bevy_perf_ui"
keywords = ["gamedev", "bevy", "perf", "profiling", "statistics"]
categories = ["game-engines"]
description = "Customizable Performance/Debug Overlay for egui"
exclude = ["assets/*", "screenshots/*"]

[features]
default = [ "entries", "widgets", "sysinfo", "chrono", "window" ]
entries = []
widgets = []
sysinfo = ["bevy/sysinfo_plugin", "bevy/multi_threaded"]
window = ["bevy/bevy_window"]
chrono = ["dep:chrono"]

[dependencies]
num-traits = "0.2.19"
chrono = { version = "0.4.40", optional = true, default-features = false, features = ["clock"] }
bevy = { version = "0.19.1", default-features = false, features = ["bevy_log", "bevy_pbr", "bevy_render", "bevy_window", "bevy_text"] }
bevy_egui = { version = "0.42.0", default-features = false, features = ["default_fonts", "render"] }
egui = { version = "0.36.2", default-features = false, features = ["default_fonts"] }

[dev-dependencies]
bevy = "0.19.1"